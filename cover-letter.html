*{box-sizing:border-box}body{margin:0;background:#171819;color:#f5f5f2;font:17px/1.7 system-ui,sans-serif}main{width:min(100% - 32px,850px);margin:36px auto}nav,.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}nav{justify-content:space-between;margin-bottom:24px}button,nav a{font:inherit;cursor:pointer;border:1px solid #66705b;border-radius:8px;padding:10px 16px;background:transparent;color:inherit;text-decoration:none}button[aria-pressed=true],#print{background:#d3ff43;color:#171819}button:focus-visible,a:focus-visible{outline:3px solid #88a928;outline-offset:4px}article{background:white;color:#20251e;padding:clamp(24px,6vw,60px);border-radius:12px;margin:24px 0}h1{font-size:clamp(26px,4vw,34px);line-height:1.2;margin-top:0}p{margin:0 0 20px}article a{color:#3d5b13}address{font-style:normal;border-top:1px solid #ddd;padding-top:20px}#note,#status{font-size:15px}#status{min-height:26px}.languages{display:flex;gap:6px}@media print{@page{size:A4;margin:18mm}body{background:white;color:black;font-size:11pt;line-height:1.45}main{width:100%;margin:0}nav,.tools,#note,#status{display:none}article{margin:0;padding:0;border-radius:0}h1{font-size:20pt}p{margin-bottom:12pt}address{font-size:10pt}a{color:inherit!important}}
</style></head><body><main><nav><a id="back" href="./">Voltar ao portfólio</a><div class="languages" role="group" aria-label="Idioma / Language"><button data-language="pt-BR" aria-label="Português">🇧🇷</button><button data-language="en" aria-label="English">🇺🇸</button><button data-language="es" aria-label="Español">🇪🇸</button></div></nav><div class="tools"><button id="copy">Copiar texto</button><button id="print">Imprimir / salvar PDF</button></div><p id="status" role="status" aria-live="polite"></p><article><h1 id="title">Carta de apresentação</h1><div id="paragraphs"></div><address><a href="mailto:oliverandre1994@gmail.com">oliverandre1994@gmail.com</a><br><a id="portfolio" href="https://oliveraraujo.github.io/portifolio/">Portfólio</a> · <a href="https://github.com/OliverAraujo">GitHub</a> · <a href="https://www.linkedin.com/in/oliver-ara%C3%BAjo/">LinkedIn</a></address></article><p id="note"></p><noscript>Ative o JavaScript para visualizar a carta nos três idiomas.</noscript></main><script>const letters = {"pt-BR":{"title":"Carta de apresentação","copy":"Copiar texto","print":"Imprimir / salvar PDF","back":"Voltar ao portfólio","copied":"Texto copiado.","failed":"Selecione o texto da carta e copie manualmente.","note":"Para uma candidatura específica, personalize o texto com o nome da empresa, a vaga e os requisitos relevantes.","salute":"Prezada equipe de recrutamento,","paragraphs":["Meu nome é Oliver Araújo, sou formado em Análise e Desenvolvimento de Sistemas pela Universidade Norte do Paraná (Unopar) e busco uma oportunidade como Desenvolvedor Python Júnior ou Desenvolvedor Back-end Júnior. Quero aplicar minha formação, desenvolver minhas habilidades e contribuir com soluções úteis para a equipe.","Atualmente, aprofundo meus conhecimentos em Python, lógica de programação e desenvolvimento back-end por meio de estudos e projetos práticos. Também possuo conhecimentos em HTML, CSS e JavaScript, que ampliam minha compreensão do desenvolvimento de aplicações web.","Entre meus projetos está um sistema de controle de estoque em Python, com cadastro de produtos, registro de entradas e saídas e consulta das quantidades disponíveis. Esse projeto me permite praticar estruturas de repetição, condições e organização de dados, conectando o aprendizado a um problema do dia a dia.","Valorizo o aprendizado contínuo, a responsabilidade e o trabalho em equipe. Busco um ambiente em que possa aprender com profissionais experientes, receber feedback e assumir responsabilidades progressivamente. Também tenho interesse em oportunidades remotas e em colaborar com equipes internacionais.","Agradeço pela atenção e fico à disposição para conversar sobre minha trajetória, meus projetos e como posso contribuir para a equipe."],"close":"Atenciosamente,","portfolio":"Portfólio"},"en":{"title":"Cover letter","copy":"Copy text","print":"Print / save PDF","back":"Back to portfolio","copied":"Text copied.","failed":"Select the letter text and copy it manually.","note":"For a specific application, tailor the letter to the company, role, and relevant requirements.","salute":"Dear Hiring Team,","paragraphs":["My name is Oliver Araújo. I hold a degree in Systems Analysis and Development from Universidade Norte do Paraná (Unopar), and I am seeking an opportunity as a Junior Python Developer or Junior Back-end Developer. I want to apply my academic background, develop my skills, and contribute useful solutions to a team.","I am currently strengthening my knowledge of Python, programming fundamentals, and back-end development through study and hands-on projects. I also have knowledge of HTML, CSS, and JavaScript, which broadens my understanding of web application development.","One of my projects is a Python inventory management system that supports product registration, incoming and outgoing stock, and stock quantity lookup. This project allows me to practice loops, conditional logic, and data organization while addressing an everyday problem.","I value continuous learning, responsibility, and teamwork. I am looking for an environment where I can learn from experienced professionals, receive feedback, and gradually take on more responsibility. I am also interested in remote opportunities and collaborating with international teams.","Thank you for your time and consideration. I would welcome the opportunity to discuss my background, projects, and how I could contribute to your team."],"close":"Sincerely,","portfolio":"Portfolio"},"es":{"title":"Carta de presentación","copy":"Copiar texto","print":"Imprimir / guardar PDF","back":"Volver al portafolio","copied":"Texto copiado.","failed":"Selecciona el texto de la carta y cópialo manualmente.","note":"Para una candidatura específica, adapta la carta a la empresa, al puesto y a los requisitos relevantes.","salute":"Estimado equipo de selección:","paragraphs":["Mi nombre es Oliver Araújo, soy graduado en Análisis y Desarrollo de Sistemas por la Universidade Norte do Paraná (Unopar) y busco una oportunidad como Desarrollador Python Júnior o Desarrollador Back-end Júnior. Quiero aplicar mi formación, desarrollar mis habilidades y aportar soluciones útiles al equipo.","Actualmente profundizo mis conocimientos de Python, fundamentos de programación y desarrollo back-end mediante estudios y proyectos prácticos. También cuento con conocimientos de HTML, CSS y JavaScript, que amplían mi comprensión del desarrollo de aplicaciones web.","Entre mis proyectos se encuentra un sistema de control de inventario en Python que permite registrar productos, entradas y salidas, y consultar las cantidades disponibles. Este proyecto me permite practicar bucles, condiciones y organización de datos, aplicando lo aprendido a un problema cotidiano.","Valoro el aprendizaje continuo, la responsabilidad y el trabajo en equipo. Busco un entorno donde pueda aprender de profesionales con experiencia, recibir comentarios y asumir responsabilidades de forma progresiva. También me interesan las oportunidades remotas y la colaboración con equipos internacionales.","Gracias por su tiempo y consideración. Quedo a su disposición para conversar sobre mi trayectoria, mis proyectos y cómo puedo contribuir al equipo."],"close":"Atentamente,","portfolio":"Portafolio"}};
let language = new URLSearchParams(location.search).get('lang');
if (!Object.hasOwn(letters,language)) language='pt-BR';
const el=id=>document.getElementById(id);
function render(){
 const t=letters[language]; document.documentElement.lang=language; document.title=t.title+' | Oliver Araújo';
 el('title').textContent=t.title; el('copy').textContent=t.copy; el('print').textContent=t.print; el('back').textContent=t.back; el('note').textContent=t.note;
 el('paragraphs').replaceChildren(...[t.salute,...t.paragraphs,t.close,'Oliver Araújo'].map(text=>{const p=document.createElement('p');p.textContent=text;return p;}));
 el('portfolio').textContent=t.portfolio; el('status').textContent='';
 document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===language)));
 history.replaceState(null,'','?lang='+encodeURIComponent(language));
}
document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.language;render();}));
el('print').addEventListener('click',()=>window.print());
el('copy').addEventListener('click',async()=>{try {await navigator.clipboard.writeText(el('paragraphs').innerText);el('status').textContent=letters[language].copied;}catch{el('status').textContent=letters[language].failed;}});
render();</script></body></html>
