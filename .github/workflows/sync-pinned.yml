name: Sync pinned projects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-pinned.yml', 'featured-fallback.json']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-pinned
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const result = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name nameWithOwner url description isPrivate
                        primaryLanguage { name }
                      }
                    }
                  }
                }
              }
            `, {login: context.repo.owner});
            if (!result.user) throw new Error('GitHub user not found');
            let projects = result.user.pinnedItems.nodes
              .filter(repo => repo.name && !repo.isPrivate)
              .map(repo => ({
                name: repo.name,
                full_name: repo.nameWithOwner,
                html_url: repo.url,
                description: repo.description,
                language: repo.primaryLanguage?.name || null
              }));
            if (projects.length === 0) {
              core.warning('No pins visible to the API; using the owner-selected fallback.');
              const fallback = await github.rest.repos.getContent({
                ...context.repo, path: 'featured-fallback.json', ref: 'main'
              });
              const names = JSON.parse(Buffer.from(fallback.data.content, 'base64').toString());
              if (!Array.isArray(names) || names.length > 6) throw new Error('Invalid fallback list');
              projects = [];
              for (const fullName of names) {
                if (typeof fullName !== 'string' || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(fullName)) throw new Error('Invalid repository name');
                const [owner, repo] = fullName.split('/');
                const { data } = await github.rest.repos.get({ owner, repo });
                if (data.private) continue;
                projects.push({
                  name: data.name, full_name: data.full_name, html_url: data.html_url,
                  description: data.description, language: data.language
                });
              }
            }
            core.info(`Found ${projects.length} featured public repositories: ${projects.map(repo => repo.full_name).join(', ')}`);
            const path = 'pinned-projects.json';
            const content = JSON.stringify(projects, null, 2) + '\n';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({...context.repo, path, ref: 'main'});
              if (Buffer.from(existing.data.content, 'base64').toString() === content) return;
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, branch: 'main', sha,
              message: 'Sync projects pinned on GitHub profile',
              content: Buffer.from(content).toString('base64')
            });
